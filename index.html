<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ECO-RED Strategic Intelligence Platform</title>
  <style>
    :root{
      --navy:#07111f;--navy2:#10233b;--bg:#f4f7fb;--surface:#ffffff;--soft:#f8fafc;
      --line:#dbe3ee;--text:#162033;--muted:#667085;--blue:#2563eb;--cyan:#0284c7;
      --teal:#0f766e;--violet:#7c3aed;--orange:#f97316;--green:#16a34a;--red:#dc2626;
      --yellow:#ca8a04;--shadow:0 14px 35px rgba(15,23,42,.08);--radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"IBM Plex Sans","Source Sans 3","Segoe UI",system-ui,sans-serif;line-height:1.48}
    button,input,select{font:inherit}button{cursor:pointer}
    .topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:22px 28px 16px}
    .topbar-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}
    .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8edcff;font-weight:850}
    .topbar h1{margin:4px 0 6px;font-size:30px;line-height:1.12}
    .subtitle{color:#c8d5e6;max-width:960px;font-size:15px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);min-height:38px;padding:0 13px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
    .btn.primary{background:#0ea5e9;color:#fff;border-color:#0ea5e9}.btn.ghost{background:rgba(255,255,255,.08);color:#e5eef9;border-color:rgba(255,255,255,.18)}
    .btn.small{min-height:32px;padding:0 10px;border-radius:9px;font-size:12px}
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:10px;margin-top:18px}
    .kpi{border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.07);padding:12px}
    .kpi strong{display:block;font-size:21px}.kpi span{font-size:12px;color:#b8c7da;font-weight:750}
    .nav{display:flex;gap:6px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 28px}
    .nav button{border:0;border-bottom:3px solid transparent;background:transparent;color:#536174;padding:16px 10px 13px;font-weight:850;white-space:nowrap}
    .nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
    .page{display:none;padding:26px 28px 34px}.page.active{display:block}
    .section-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}
    .section-head h2{margin:0;font-size:25px}.section-head p{margin:6px 0 0;color:var(--muted);max-width:950px}
    .grid{display:grid;gap:16px}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-template-columns:1.25fr .75fr}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
    .card.flush{padding:0;overflow:hidden}.card h3{margin:0 0 7px;font-size:17px}.hint{color:var(--muted);font-size:13px}
    .metric .label{font-size:12px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em}.metric .value{font-size:31px;font-weight:850;margin-top:8px;color:#07111f}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;color:#536174;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850}.tab.active{background:#eaf2ff;color:var(--blue);border-color:#bfdbfe}
    .bar-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1.3fr) 54px;gap:10px;align-items:center;font-size:13px;margin:8px 0}.bar-label{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:10px;border-radius:999px;background:#eef2f7;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),#22d3ee)}.bar-value{text-align:right;color:var(--muted);font-weight:850}
    .badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin:2px;background:#f8fafc;font-size:12px;font-weight:800;color:#344054}
    .badge.cyan{background:#ecfeff;color:#0e7490;border-color:#a5f3fc}.badge.green{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}.badge.orange{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.badge.red{background:#fef2f2;color:#b91c1c;border-color:#fecaca}.badge.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.badge.violet{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}
    .flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.flow span{border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:7px 11px;font-weight:850}.flow b{color:#94a3b8}
    .detail-row{border-bottom:1px solid #e8eef5;padding:10px 0;font-size:14px}.detail-row b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#344054;margin-bottom:3px}
    .network-layout{display:grid;grid-template-columns:310px minmax(480px,1fr) 340px;gap:16px;min-height:68vh}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.panel-body{padding:16px;overflow:auto}.filters{display:grid;gap:12px}
    .field{display:grid;gap:7px}.field label{font-size:12px;font-weight:850;color:#344054}select,input{width:100%;min-height:40px;border:1px solid #cdd6e3;border-radius:10px;padding:0 11px;background:#fff;color:var(--text);outline:none}
    .canvas-card{display:grid;grid-template-rows:auto 1fr}.canvas-head{display:flex;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--line);align-items:center}.canvas-wrap{position:relative;min-height:560px;background:linear-gradient(180deg,#fbfdff,#f6f9fc)}canvas.network{display:block;width:100%;height:100%;min-height:560px}
    .status{display:flex;gap:6px;flex-wrap:wrap}.status span{background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:850}.empty{display:none;position:absolute;inset:20px;place-items:center;text-align:center;background:rgba(255,255,255,.86);border:1px dashed #cbd5e1;border-radius:16px;color:var(--muted)}.empty.show{display:grid}
    .table-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}.table-toolbar input,.table-toolbar select{max-width:280px}.table-wrap{overflow:auto;max-height:580px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #e8eef5;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;color:#475467;text-transform:uppercase;font-size:12px;letter-spacing:.04em;cursor:pointer}tbody tr:hover{background:#f8fbff}
    .drawer-backdrop{position:fixed;inset:0;background:rgba(7,17,31,.38);display:none;z-index:70}.drawer-backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(650px,94vw);background:#fff;z-index:80;transform:translateX(105%);transition:.22s;box-shadow:-20px 0 45px rgba(15,23,42,.2);display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.drawer-head{padding:20px;background:var(--navy);color:#fff;display:flex;justify-content:space-between;gap:12px}.drawer-head h2{margin:0;font-size:20px}.drawer-body{padding:18px;overflow:auto;display:grid;gap:12px}.close{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:20px}
    .matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quadrant{min-height:170px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.quadrant h3{font-size:16px}.point{display:inline-flex;margin:3px;padding:4px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:850}
    .risk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.risk-cell{border-radius:14px;border:1px solid var(--line);padding:14px;background:#fff}.risk-high{border-color:#fecaca;background:#fef2f2}.risk-mid{border-color:#fed7aa;background:#fff7ed}.risk-low{border-color:#bbf7d0;background:#ecfdf3}
    .timeline-list{display:grid;gap:12px}.timeline-item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px}.timeline-item h3{margin:0 0 10px}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);opacity:0;z-index:100;background:rgba(7,17,31,.94);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-weight:800;transition:.18s;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1180px){.network-layout{display:flex;flex-direction:column}.canvas-card{order:1}.network-layout>.panel:first-child{order:2}.network-layout>.panel:last-child{order:3}.canvas-wrap,canvas.network{min-height:62vh}.cols-4{grid-template-columns:repeat(2,1fr)}.wide,.cols-2,.cols-3,.risk-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:640px){.topbar{padding:18px 14px}.topbar h1{font-size:24px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.actions .btn{width:100%;min-height:42px}.kpis{grid-template-columns:repeat(2,1fr)}.nav{padding:0 10px}.nav button{font-size:13px;padding:13px 9px 10px}.page{padding:16px 10px 24px}.section-head{align-items:flex-start;flex-direction:column}.section-head h2{font-size:21px}.canvas-wrap,canvas.network{min-height:58vh}.canvas-head{align-items:flex-start;flex-direction:column}.table-toolbar{align-items:stretch;flex-direction:column}.table-toolbar input,.table-toolbar select{max-width:none}.matrix{grid-template-columns:1fr}.drawer{width:100vw}.bar-row{grid-template-columns:minmax(90px,1fr) minmax(80px,1fr) 40px}select,input{min-height:44px;font-size:16px}}
  </style>
  <link rel="stylesheet" href="premium.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div>
        <div class="eyebrow">ECO-RED Strategic Intelligence</div>
        <h1>ECO-RED Strategic Intelligence</h1>
        <div class="subtitle">Una piattaforma di technology intelligence per leggere ECO-RED attraverso pubblicazioni scientifiche, brevetti, reti tecnologiche, mercato e readiness di investimento.</div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="resetBtn">Reset network</button>
        <button class="btn ghost" id="exportBtn">Export CSV</button>
        <button class="btn primary" id="helpBtn">Help</button>
      </div>
    </div>
    <div class="kpis" id="globalKpis"></div>
  </header>
  <nav class="nav" id="mainNav">
    <button class="active" data-page="home">Home</button>
    <button data-page="profile">ECO-RED Profile</button>
    <button data-page="technology">Technology & IP</button>
    <button data-page="publications">Publications</button>
    <button data-page="integrated">Integrated Science/IP</button>
    <button data-page="market">Market & Competitive</button>
    <button data-page="strategy">Strategic Positioning</button>
    <button data-page="dataroom">Data Room</button>
  </nav>
  <main>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-profile"></section>
    <section class="page" id="page-technology"></section>
    <section class="page" id="page-publications"></section>
    <section class="page" id="page-integrated"></section>
    <section class="page" id="page-market"></section>
    <section class="page" id="page-strategy"></section>
    <section class="page" id="page-dataroom"></section>
  </main>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div><div class="eyebrow" id="drawerEyebrow">Detail</div><h2 id="drawerTitle"></h2></div>
      <button class="close" id="drawerClose">x</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="toast" id="toast"></div>
  <script>
    const DATA_BASE = "data/";
    const cache = {};
    const state = {page:"home", currentRows:[], currentColumns:[], currentExport:"export.csv", network:null};
    const typeColors = {publication:"#2563eb",patent:"#2563eb",technology:"#0f766e",country:"#64748b",author:"#7c3aed",performance_class:"#ca8a04",assignee:"#7c3aed",domain:"#16a34a",concept:"#0f766e",science_cluster:"#0284c7",patent_cluster:"#f97316",shared_technology:"#0f766e",cpc_group:"#f97316",cpc_code:"#fb923c",focus:"#0284c7",year:"#ca8a04",legal:"#dc2626"};
    const $ = id => document.getElementById(id);
    function esc(v){return String(v ?? "").replace(/[&<>"']/g, s => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));}
    function fmt(v){return (typeof v === "number") ? new Intl.NumberFormat("it-IT").format(v) : esc(v ?? "n.d.");}
    function trunc(v,n=90){v=String(v ?? ""); return v.length>n ? v.slice(0,n-1)+"..." : v;}
    function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200);}
    async function loadJson(name){if(cache[name]) return cache[name]; try{const r=await fetch(DATA_BASE+name); if(!r.ok) throw new Error(name+" "+r.status); cache[name]=await r.json(); return cache[name];}catch(e){toast("Dati non caricati. Apri il sito tramite server locale o Vercel, non direttamente come file."); throw e;}}
    function sectionHead(title,desc){return `<div class="section-head"><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div></div>`;}
    function metricCard(label,value,note){return `<div class="card metric"><div class="label">${esc(label)}</div><div class="value">${fmt(value)}</div><div class="hint">${esc(note||"")}</div></div>`;}
    function badge(text,tone="blue"){return `<span class="badge ${tone}">${esc(text)}</span>`;}
    function chips(arr,n=8,tone="blue"){arr=Array.isArray(arr)?arr.filter(Boolean):arr?[arr]:[]; return arr.slice(0,n).map(x=>badge(x,tone)).join("") || '<span class="hint">n.d.</span>';}
    function barRows(rows){rows=rows||[]; const max=Math.max(...rows.map(r=>Number(r.count??r.value??r.publications??r.patents??0)),1); return rows.map(r=>{const v=Number(r.count??r.value??r.publications??r.patents??0); const name=r.name||r.technology||r.label||"n.d."; return `<div class="bar-row"><div class="bar-label" title="${esc(name)}">${esc(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/max*100)}%"></div></div><div class="bar-value">${fmt(v)}</div></div>`}).join("") || '<p class="hint">Dato non disponibile.</p>';}
    function setExport(rows,cols,name){state.currentRows=rows||[];state.currentColumns=cols||[];state.currentExport=name||"export.csv";}
    function csvCell(v){if(Array.isArray(v)) v=v.join("; "); return `"${String(v??"").replace(/"/g,'""')}"`;}
    function csvExport(){const rows=state.currentRows, cols=state.currentColumns; if(!rows.length||!cols.length){toast("Nessun dato da esportare."); return;} const csv="\ufeff"+[cols.map(c=>csvCell(c.label)).join(";"),...rows.map(r=>cols.map(c=>csvCell(c.export?c.export(r):r[c.key])).join(";"))].join("\r\n"); const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}); const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1); if(isIOS){const rd=new FileReader(); rd.onload=()=>{window.open(rd.result,"_blank"); toast("CSV pronto.");}; rd.readAsDataURL(blob); return;} const a=document.createElement("a"),url=URL.createObjectURL(blob); a.href=url; a.download=state.currentExport; a.style.display="none"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},4000); toast("Export creato: "+state.currentExport);}
    function val(r,k){const v=r[k]; return Array.isArray(v)?v.join(" "):v??"";} function cell(v){return Array.isArray(v)?v.join("; "):v??"";}
    function renderTable(containerId,rows,cols,opt={}){const el=$(containerId); const key=containerId+"_sort"; state[key]=state[key]||{sort:cols[0].key,dir:"asc"}; const st=state[key]; const sorted=[...(rows||[])].sort((a,b)=>String(val(a,st.sort)).localeCompare(String(val(b,st.sort)),undefined,{numeric:true})*(st.dir==="asc"?1:-1)); el.innerHTML=`<table><thead><tr>${cols.map(c=>`<th data-k="${c.key}">${esc(c.label)}${st.sort===c.key?(st.dir==="asc"?" â–²":" â–¼"):""}</th>`).join("")}</tr></thead><tbody>${sorted.map((r,i)=>`<tr data-i="${i}">${cols.map(c=>`<td>${c.render?c.render(r):esc(cell(r[c.key]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`; el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k; if(st.sort===k) st.dir=st.dir==="asc"?"desc":"asc"; else {st.sort=k; st.dir="desc";} renderTable(containerId,rows,cols,opt);}); if(opt.onClick) el.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>opt.onClick(sorted[Number(tr.dataset.i)]));}
    function openDrawer(title,body,eyebrow="Detail"){$("drawerEyebrow").textContent=eyebrow;$("drawerTitle").textContent=trunc(title,95);$("drawerBody").innerHTML=body;$("drawer").classList.add("show");$("drawerBackdrop").classList.add("show");}
    function closeDrawer(){$("drawer").classList.remove("show");$("drawerBackdrop").classList.remove("show");}
    $("drawerClose").onclick=closeDrawer; $("drawerBackdrop").onclick=closeDrawer; $("exportBtn").onclick=csvExport; $("resetBtn").onclick=()=>state.network&&state.network.reset();
    $("helpBtn").onclick=()=>openDrawer("Come leggere la piattaforma",`<p>Il sito ha due livelli: executive per capire rapidamente ECO-RED e analyst per verificare dati, network, tabelle e limiti metodologici.</p><div class="detail-row"><b>Nota</b>Le reti mostrano associazioni dai dati. Co-occorrenza non significa causalita o collaborazione.</div><div class="detail-row"><b>Uso corretto</b>Aprire il sito tramite server locale o Vercel, cosi i JSON statici possono essere caricati.</div>`,"Help");

    async function init(){const ss=await loadJson("site_summary.json"); $("globalKpis").innerHTML=(ss.kpis||[]).map(k=>`<div class="kpi"><strong>${fmt(k.value)}</strong><span>${esc(k.label)}</span></div>`).join(""); document.querySelectorAll("#mainNav button").forEach(b=>b.onclick=()=>go(b.dataset.page)); renderHome();}
    async function go(page){state.page=page; state.network=null; document.querySelectorAll("#mainNav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page)); document.querySelectorAll(".page").forEach(p=>p.classList.remove("active")); $("page-"+page).classList.add("active"); const fn={home:renderHome,profile:renderProfile,technology:renderTechnology,publications:renderPublications,integrated:renderIntegrated,market:renderMarket,strategy:renderStrategy,dataroom:renderDataRoom}[page]; await fn();}

    async function renderHome(){const [ss,profile,market]=await Promise.all([loadJson("site_summary.json"),loadJson("eco_red_profile.json"),loadJson("market_intelligence.json")]); $("page-home").innerHTML=sectionHead(ss.title,ss.subtitle)+`<div class="grid cols-3">${(ss.executive_story||[]).map((x,i)=>`<div class="card"><h3>${["Perche esiste","Come e costruita","Come usarla"][i]||"Insight"}</h3><p>${esc(x)}</p></div>`).join("")}</div><div class="card" style="margin-top:16px"><h3>Value chain ECO-RED</h3><div class="flow">${profile.value_flow.map((x,i)=>`<span>${esc(x)}</span>${i<profile.value_flow.length-1?"<b>></b>":""}`).join("")}</div></div><div class="grid cols-4" style="margin-top:16px">${market.drivers.map(d=>`<div class="card"><h3>${esc(d.name)}</h3><p>${esc(d.text)}</p></div>`).join("")}</div><div class="card flush" style="margin-top:16px"><div class="table-toolbar"><b>Mappa contenuti -> sezioni</b></div><div class="table-wrap" id="mapTable"></div></div>`; const cols=[{key:"source",label:"Fonte"},{key:"type",label:"Tipo"},{key:"feeds",label:"Alimenta",render:r=>chips(r.feeds,8),export:r=>(r.feeds||[]).join("; ")},{key:"limits",label:"Limiti"}]; renderTable("mapTable",ss.content_map||[],cols); setExport(ss.content_map||[],cols,"content_map.csv");}

    async function renderDataRoom(){const [pub,pat]=await Promise.all([loadJson("publications_tables.json"),loadJson("patents_tables.json")]); $("page-dataroom").innerHTML=sectionHead("Data Explorer","Dataset navigabili della piattaforma: pubblicazioni scientifiche e brevetti, con ricerca, ordinamento, dettaglio ed export CSV.")+`<div class="grid cols-2">${metricCard("Pubblicazioni",pub.publications?.length||0,"tabella esportabile")}${metricCard("Brevetti",pat.patents?.length||0,"tabella esportabile")}</div><div class="tabs" style="margin-top:16px"><button class="tab active" data-dr="pubs">Publication records</button><button class="tab" data-dr="pats">Patent records</button></div><div id="drContent"></div>`; document.querySelectorAll("[data-dr]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-dr]").forEach(x=>x.classList.toggle("active",x===b)); if(b.dataset.dr==="pubs") renderPublicationTable(pub.publications||[],"drContent"); if(b.dataset.dr==="pats") renderPatentTable(pat.patents||[],"drContent");}); renderPublicationTable(pub.publications||[],"drContent");}
    function publicationCols(){return[{key:"title",label:"Title",render:r=>esc(trunc(r.title,90))},{key:"authors",label:"Authors",render:r=>esc((Array.isArray(r.authors)?r.authors:String(r.authors||"").split(";")).slice(0,3).join("; "))},{key:"year",label:"Year"},{key:"country",label:"Country"},{key:"doi",label:"DOI"},{key:"FE_CO",label:"FE_CO"},{key:"Stability",label:"Stability"},{key:"Current Density",label:"Current Density"},{key:"technologies",label:"Technologies",render:r=>chips(r.technologies||r["Tecnologie"]||[],5),export:r=>(r.technologies||[]).join("; ")}];}
    function patentCols(){return[{key:"id",label:"Patent"},{key:"title",label:"Title",render:r=>esc(trunc(r.title,80))},{key:"year",label:"Year"},{key:"assignees",label:"Assignees",render:r=>chips(r.assignees,4),export:r=>(r.assignees||[]).join("; ")},{key:"cpc_groups",label:"CPC",render:r=>chips(r.cpc_groups,4,"orange"),export:r=>(r.cpc_groups||[]).join("; ")},{key:"legal_state",label:"Legal"},{key:"focus",label:"Focus",render:r=>chips(r.focus,4,"cyan"),export:r=>(r.focus||[]).join("; ")}];}
    function actorCols(){return[{key:"name",label:"Assignee"},{key:"patents",label:"Brevetti"},{key:"citations",label:"Citazioni"},{key:"domains",label:"Domini",render:r=>chips(r.domains,4,"green"),export:r=>(r.domains||[]).join("; ")},{key:"cpc_groups",label:"CPC",render:r=>chips(r.cpc_groups,4,"orange"),export:r=>(r.cpc_groups||[]).join("; ")}];}
    function renderPublicationTable(rows,container="pubContent"){$(container).innerHTML=`<div class="card flush"><div class="table-toolbar"><div><b>Publication Table</b><div class="hint">Ricerca, ordinamento, export e dettaglio pubblicazione.</div></div><input id="${container}Search" placeholder="Cerca pubblicazione"></div><div class="table-wrap" id="${container}Table"></div></div>`; const draw=()=>{const q=($(container+"Search").value||"").toLowerCase(); const f=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)); renderTable(container+"Table",f,publicationCols(),{onClick:openPublication}); setExport(f,publicationCols(),"publications.csv");}; $(container+"Search").oninput=draw; draw();}
    function renderPatentTable(rows,container="techContent"){$(container).innerHTML=`<div class="card flush"><div class="table-toolbar"><div><b>Patent Table</b><div class="hint">Brevetti, assignee, CPC e focus.</div></div><input id="${container}Search" placeholder="Cerca brevetto"></div><div class="table-wrap" id="${container}Table"></div></div>`; const draw=()=>{const q=($(container+"Search").value||"").toLowerCase(); const f=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)); renderTable(container+"Table",f,patentCols(),{onClick:openPatent}); setExport(f,patentCols(),"patents.csv");}; $(container+"Search").oninput=draw; draw();}
    function renderActorTable(rows){$("techContent").innerHTML=`<div class="card flush"><div class="table-toolbar"><b>Actor Intelligence</b></div><div class="table-wrap" id="actorTable"></div></div>`; renderTable("actorTable",rows,actorCols()); setExport(rows,actorCols(),"assignees.csv");}
    function openPublication(r){openDrawer(r.title||"Pubblicazione",`<div class="detail-row"><b>Titolo</b>${esc(r.title)}</div><div class="detail-row"><b>Autori</b>${esc(Array.isArray(r.authors)?r.authors.join("; "):r.authors||"n.d.")}</div><div class="detail-row"><b>Anno / Paese</b>${esc(r.year||"n.d.")} - ${esc(r.country||"n.d.")}</div><div class="detail-row"><b>DOI</b>${esc(r.doi||"n.d.")}</div><div class="detail-row"><b>Abstract</b>${esc(r.abstract||"n.d.")}</div><div class="detail-row"><b>Performance</b>FE_CO ${esc(r.FE_CO??"n.d.")} - Stabilita ${esc(r.Stability??"n.d.")} h - Corrente ${esc(r["Current Density"]??"n.d.")} mA/cm2</div><div class="detail-row"><b>Tecnologie ECO RED-like</b>${chips(r.technologies||[],12)}</div><div class="detail-row"><b>Source URL</b>${r.source_url?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_url)}</a>`:"n.d."}</div>`,"Publication detail");}
    function openPatent(r){openDrawer(`${r.id||""} - ${r.title||""}`,`<div class="detail-row"><b>Numero brevetto</b>${esc(r.id)}</div><div class="detail-row"><b>Titolo</b>${esc(r.title)}</div><div class="detail-row"><b>Anno</b>${esc(r.year||"n.d.")}</div><div class="detail-row"><b>Assignee</b>${chips(r.assignees,8,"violet")}</div><div class="detail-row"><b>Stato legale</b>${badge(r.legal_state||"n.d.")}</div><div class="detail-row"><b>Paesi</b>${chips(r.countries,8)}</div><div class="detail-row"><b>CPC</b>${chips([...(r.cpc_groups||[]),...(r.cpc_codes||[]).slice(0,8)],14,"orange")}</div><div class="detail-row"><b>Domini</b>${chips(r.domains,8,"green")}</div><div class="detail-row"><b>Concetti tecnici</b>${chips(r.concepts,16,"cyan")}</div><div class="detail-row"><b>Hyperedge</b>Questo brevetto collega simultaneamente attori, tecnologie, concetti, paesi e classificazioni.</div>`,"Patent detail");}

    function nodeLabel(id,view){return (view.nodes||[]).find(n=>n.id===id)?.label || String(id).replace(/^[^:]+::/,"");}
    function renderNetworkSection(container,net,prefix){const views=Object.keys(net.views||{}); $(container).innerHTML=`<div class="network-layout"><div class="panel"><div class="panel-body filters"><div class="field"><label>Vista</label><select id="${prefix}View">${views.map(v=>`<option value="${v}">${esc(net.views[v].label||v)}</option>`).join("")}</select></div><div class="field"><label>Ricerca</label><input id="${prefix}Search" placeholder="Nodo, brevetto, tecnologia"></div><div class="field"><label>Numero massimo nodi</label><select id="${prefix}Max"><option>100</option><option selected>220</option><option>360</option></select></div><button class="btn" id="${prefix}Reset">Reset view</button><div class="card"><h3>Come leggere</h3><p id="${prefix}Desc" class="hint"></p><p class="hint">La semantica dell'arco dipende dalla vista: assegnazione, classificazione, citazione o co-occorrenza.</p></div></div></div><div class="panel canvas-card"><div class="canvas-head"><b id="${prefix}Title"></b><div class="status" id="${prefix}Status"></div></div><div class="canvas-wrap"><canvas class="network" id="${prefix}Canvas"></canvas><div class="empty" id="${prefix}Empty">Nessun arco con i filtri correnti.</div></div></div><div class="panel"><div class="panel-body" id="${prefix}Detail"><h3>Dettagli nodo</h3><p class="hint">Seleziona un nodo per vedere tipo, grado e vicinato.</p></div></div></div>`; const set=()=>{const v=$(prefix+"View").value; $(prefix+"Title").textContent=net.views[v].label||v; $(prefix+"Desc").textContent=net.views[v].description||"Vista di rete costruita dal dataset."; if(state.network) state.network.stop(); state.network=new MiniNetwork(prefix,net.views[v]); state.network.render();}; $(prefix+"View").onchange=set; $(prefix+"Search").oninput=()=>state.network&&state.network.render(); $(prefix+"Max").onchange=()=>state.network&&state.network.render(); $(prefix+"Reset").onclick=()=>state.network&&state.network.reset(); set();}
    class MiniNetwork{
      constructor(prefix,view){this.p=prefix;this.view=view;this.canvas=$(prefix+"Canvas");this.ctx=this.canvas.getContext("2d");this.t={x:0,y:0,s:1};this.nodes=[];this.edges=[];this.selected=null;this.drag=null;this.pan=false;this.last=null;this.running=false;this.bind();this.resize();}
      bind(){this.canvas.onpointerdown=e=>this.down(e);this.canvas.onpointermove=e=>this.move(e);this.canvas.onpointerup=e=>this.up(e);this.canvas.onpointerleave=e=>this.up(e);this.canvas.onwheel=e=>this.wheel(e);window.addEventListener("resize",()=>this.resize());}
      resize(){const r=this.canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;this.canvas.width=Math.max(320,r.width*d);this.canvas.height=Math.max(320,r.height*d);this.ctx.setTransform(d,0,0,d,0,0);this.draw();}
      stop(){this.running=false;}
      render(){const q=($(this.p+"Search")?.value||"").toLowerCase(); const max=Number($(this.p+"Max")?.value||220); let edges=this.view.edges||[]; if(q){edges=edges.filter(e=>nodeLabel(e.source,this.view).toLowerCase().includes(q)||nodeLabel(e.target,this.view).toLowerCase().includes(q)||(e.items||[]).join(" ").toLowerCase().includes(q));} const deg={}; edges.forEach(e=>{deg[e.source]=(deg[e.source]||0)+(e.weight||1); deg[e.target]=(deg[e.target]||0)+(e.weight||1);}); const ids=new Set(Object.keys(deg).sort((a,b)=>deg[b]-deg[a]).slice(0,max)); edges=edges.filter(e=>ids.has(e.source)&&ids.has(e.target)); const nodeMap=new Map((this.view.nodes||[]).map(n=>[n.id,n])); const w=this.canvas.clientWidth||800,h=this.canvas.clientHeight||520; this.nodes=[...ids].map((id,i)=>{const base=nodeMap.get(id)||{}; const a=i/Math.max(1,ids.size)*Math.PI*2; return {...base,id,label:nodeLabel(id,this.view),degree:deg[id]||1,x:w/2+Math.cos(a)*(180+Math.random()*90),y:h/2+Math.sin(a)*(150+Math.random()*80),vx:0,vy:0};}); const idx=new Map(this.nodes.map(n=>[n.id,n])); this.edges=edges.map(e=>({...e,s:idx.get(e.source),t:idx.get(e.target)})).filter(e=>e.s&&e.t); $(this.p+"Status").innerHTML=[`${this.nodes.length} nodi`,`${this.edges.length} archi`].map(x=>`<span>${x}</span>`).join(""); $(this.p+"Empty").classList.toggle("show",!this.edges.length); this.running=true; this.tick=0; this.loop();}
      loop(){if(!this.running||state.network!==this)return; this.sim(); this.draw(); this.tick++; requestAnimationFrame(()=>this.loop());}
      sim(){const w=this.canvas.clientWidth||800,h=this.canvas.clientHeight||520; for(const e of this.edges){const s=e.s,t=e.t,dx=t.x-s.x,dy=t.y-s.y,dist=Math.max(30,Math.hypot(dx,dy)),f=(dist-110)*0.004,fx=dx/dist*f,fy=dy/dist*f;s.vx+=fx;t.vx-=fx;s.vy+=fy;t.vy-=fy;} for(let i=0;i<this.nodes.length;i++){for(let j=i+1;j<this.nodes.length;j++){const a=this.nodes[i],b=this.nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=Math.max(180,dx*dx+dy*dy),d=Math.sqrt(d2),f=Math.min(2,650/d2),fx=dx/d*f,fy=dy/d*f;a.vx-=fx;b.vx+=fx;a.vy-=fy;b.vy+=fy;}} for(const n of this.nodes){if(n!==this.drag){n.vx+=(w/2-n.x)*0.0009;n.vy+=(h/2-n.y)*0.0009;n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;}}}
      draw(){if(!this.ctx)return; const c=this.ctx,w=this.canvas.clientWidth||800,h=this.canvas.clientHeight||520; c.clearRect(0,0,w,h); c.save(); c.translate(this.t.x,this.t.y); c.scale(this.t.s,this.t.s); const neigh=this.selected?new Set([this.selected.id]):null; if(neigh) this.edges.forEach(e=>{if(e.source===this.selected.id)neigh.add(e.target); if(e.target===this.selected.id)neigh.add(e.source);}); for(const e of this.edges){const rel=!neigh||(neigh.has(e.source)&&neigh.has(e.target)); c.strokeStyle=`rgba(37,99,235,${rel?0.24:0.045})`; c.lineWidth=Math.max(0.8,Math.log1p(e.weight||1)); c.beginPath(); c.moveTo(e.s.x,e.s.y); c.lineTo(e.t.x,e.t.y); c.stroke();} for(const n of this.nodes){const rel=!neigh||neigh.has(n.id),r=6+Math.min(12,Math.log1p(n.degree||1)*2); c.globalAlpha=rel?1:0.22; c.fillStyle=typeColors[n.type]||"#94a3b8"; c.beginPath(); c.arc(n.x,n.y,r,0,Math.PI*2); c.fill(); c.strokeStyle=n===this.selected?"#07111f":"#fff"; c.lineWidth=n===this.selected?4:1.5; c.stroke(); if(n===this.selected||n.degree>Math.max(4,this.nodes.length/45)){c.globalAlpha=1; c.font="12px Inter,Segoe UI,sans-serif"; const tx=trunc(n.label,24),tw=c.measureText(tx).width+10; c.fillStyle="rgba(255,255,255,.92)"; c.fillRect(n.x+r+5,n.y-10,tw,20); c.fillStyle="#263241"; c.fillText(tx,n.x+r+10,n.y+4);}} c.globalAlpha=1; c.restore();}
      world(e){const r=this.canvas.getBoundingClientRect();return{x:(e.clientX-r.left-this.t.x)/this.t.s,y:(e.clientY-r.top-this.t.y)/this.t.s};}
      nodeAt(p){for(let i=this.nodes.length-1;i>=0;i--){const n=this.nodes[i],r=8+Math.min(12,Math.log1p(n.degree||1)*2); if(Math.hypot(n.x-p.x,n.y-p.y)<=r+4)return n;} return null;}
      down(e){const p=this.world(e),n=this.nodeAt(p); this.last={x:e.clientX,y:e.clientY}; if(n)this.drag=n; else this.pan=true;}
      move(e){if(this.drag){const p=this.world(e); this.drag.x=p.x; this.drag.y=p.y;} else if(this.pan&&this.last){this.t.x+=e.clientX-this.last.x; this.t.y+=e.clientY-this.last.y; this.last={x:e.clientX,y:e.clientY};}}
      up(){if(this.drag){this.selected=this.drag; $(this.p+"Detail").innerHTML=`<h3>${esc(this.selected.label)}</h3><div class="detail-row"><b>Tipo</b>${esc(this.selected.type||"n.d.")}</div><div class="detail-row"><b>Grado pesato</b>${fmt(this.selected.degree)}</div><div class="detail-row"><b>Interpretazione</b>Il nodo e collegato secondo la vista attiva; verificare sempre la semantica della relazione nella card Come leggere.</div>`;} this.drag=null; this.pan=false;}
      wheel(e){e.preventDefault(); this.t.s=Math.max(0.25,Math.min(4,this.t.s*(e.deltaY<0?1.08:0.92)));}
      reset(){this.t={x:0,y:0,s:1}; this.selected=null; this.render();}
    }

    init();
  </script>
  <script src="premium.js"></script>
</body>
